plugins {
    id 'com.android.application'
}

// 从 keystore.properties 读取签名配置（该文件不提交到 git）
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.hyacine.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.hyacine.app"
        minSdk 24
        targetSdk 34
        versionCode 36
        versionName "3.16"
    }

    signingConfigs {
        debug {
            // 统一使用hyacine-debug.keystore签名，确保覆盖安装不冲突
            storeFile file("../hyacine-debug.keystore")
            storePassword 'hyacine123'
            keyAlias 'hyacine'
            keyPassword 'hyacine123'
        }
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
